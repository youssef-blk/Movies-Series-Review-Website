<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowTime | Game Of Thrones</title>

    <link rel="stylesheet" href="../css/all.min.css" />

    <link rel="stylesheet" href="../css/bootstrap.min.css" />

    <link rel="stylesheet" href="got.css" />
  </head>

  <body onclick="skipTyping()">
    <!-- HERO -->
    <div class="header-image">
      <nav id="nav-id" class="hidden-element">
        <div class="logo">
          <img src="imag-got/logohbo.png" alt="logo" />
        </div>

        <ul class="links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Series</a></li>
          <li><a href="#">Movies</a></li>
          <li><a href="#">Trending</a></li>
        </ul>
      </nav>

      <div class="hero-content">
        <div id="text-wrapper">
          <span id="typing-text" class="hero-desc"></span>
          <span class="cursor">|</span>
        </div>

        <div id="logo-reveal">
          <span class="season-tag">SEASON 7 - COMING SOON</span>
          <img src="imag-got/logogot.png" class="floating-logo" />
        </div>
      </div>
      <div class="rating-box">
    <h1 class="rating-number">8,8</h1>

    <div class="stars">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-regular fa-star"></i>
    </div>

    <p class="rating-text">MOVIE RATE</p>
</div>
    </div>

    <!-- SECTION JDIDA -->
    <div id="after-hero" class="after-hero">
      <h1 class="after-title">Welcome to the Dark Side</h1>
      <p class="after-text">
        Dive into the mind of Dexter Morgan... where justice meets darkness.
      </p>
    </div>

    
    <script src="got.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!-- <script src="../js/all.min.js"></script> -->
  </body>
</html>
