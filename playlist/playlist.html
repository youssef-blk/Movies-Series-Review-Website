<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="playlist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>My Playlist</title>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-play"></i> MY PLAYLIST</h1>
        <span>12 Movies</span>
    </div>

    <div class="movies-grid">
        
        <div class="movie-card">
            <button class="remove-btn"><i class="fa-solid fa-trash"></i></button>
            <img src="https://images.moviesanywhere.com/467710611d3d62323ef07a346b07da74/1966952a-9216-4171-97b7-65775f0a7114.jpg" alt="Movie Title">
            <div class="movie-info">
                <h3>Spider-Man</h3>
                <span>4.8 <i class="fa-solid fa-star"></i></span>
            </div>
        </div>

        <div class="movie-card">
            <button class="remove-btn"><i class="fa-solid fa-trash"></i></button>
            <img src="https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg" alt="Inception">
            <div class="movie-info">
                <h3>Inception</h3>
                <span>4.9 <i class="fa-solid fa-star"></i></span>
            </div>
        </div>

        <div class="movie-card">
            <button class="remove-btn"><i class="fa-solid fa-trash"></i></button>
            <img src="https://m.media-amazon.com/images/M/MV5BMjE0Nzg3MTYyOF5BMl5BanBnXkFtZTcwNzkzOTc2Mg@@._V1_.jpg" alt="The Dark Knight">
            <div class="movie-info">
                <h3>The Dark Knight</h3>
                <span>5.0 <i class="fa-solid fa-star"></i></span>
            </div>
        </div>

        </div>

</body>
</html>
