<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowTime | Sherlock</title>

    <link rel="stylesheet" href="../css/all.min.css" />

    <link rel="stylesheet" href="../css/bootstrap.min.css" />

    <link rel="stylesheet" href="sherlock.css" />
  </head>

  <body onclick="skipTyping()">
    <!-- HERO -->
    <div class="header-image">
      <nav id="nav-id" class="hidden-element">
        <div class="logo">
          <img src="../images/logo.png" alt="" />
        </div>

        <ul class="links">
          <li><a href="#home">Home</a></li>
          <li><a href="#latest-updates">Series</a></li>
          <li><a href="#latest-updates">Movies</a></li>
          <li><a href="#latest-updates">Trending</a></li>
        </ul>

        <div class="search">
          <i class="fa-solid fa-magnifying-glass" id="searchBtn"></i>
          <form action="" id="searchForm">
            <input
              type="text"
              name="search"
              id="searchInput"
              plac
              eholder="SearchInput"
            />
            <button type="submit" name="searchSubmit" id="searchSubmit">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
        </div>
      </nav>

      <div class="hero-content">
        <div id="text-wrapper">
          <span id="typing-text" class="hero-desc"></span>
          <span class="cursor">|</span>
        </div>

        <div id="logo-reveal">
          <img src="title.png" class="floating-logo" />
        </div>
      </div>
      <div class="rating-box">
        <h1 class="rating-number">8,8</h1>

        <div class="stars">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
        </div>

        <p class="rating-text">MOVIE RATE</p>
      </div>
    </div>

    <!-- SECTION JDIDA -->
    <div id="after-hero" class="after-hero">
      <h1 class="after-title">Welcome to the Dark Side</h1>
      <p class="after-text">
        Dive into the mind of Dexter Morgan... where justice meets darkness.
      </p>
    </div>
    <script src="sherlock.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!-- <script src="../js/all.min.js"></script> -->
  </body>
</html>
