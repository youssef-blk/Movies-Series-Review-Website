<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU | Joe Goldberg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080808; 
            color: #ffffff;
            font-family: 'Georgia', serif; /* Font classy dial l-kotob */
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 30px 10%;
            align-items: center;
            position: absolute;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 10px;
            color: #e50914; 
            text-transform: uppercase;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            gap: 50px;
            background: linear-gradient(to right, #080808 40%, rgba(8, 8, 8, 0.6)), 
                        url('https://www.transparenttextures.com/patterns/dark-matter.png');
        }

        .hero-content {
            flex: 1.2;
        }

        .sub-title {
            color: #3d5a44;
            letter-spacing: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border-left: 3px solid #e50914;
            padding-left: 15px;
        }

        .hero-content h1 {
            font-size: 5rem;
            line-height: 1;
            margin: 25px 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .highlight {
            color: #e50914;
            background: transparent;
        }

        .hero-content p {
            max-width: 550px;
            color: #999;
            margin-bottom: 35px;
            font-size: 1.1rem;
            font-style: italic;
        }

        .btn-main {
            display: inline-block;
            padding: 18px 45px;
            background-color: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-main:hover {
            background-color: #e50914;
            border-color: #e50914;
            
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.4);
        }

        .hero-image {
            flex: 1;
            text-align: right;
            position: relative;
        }

        .hero-image img {
            width: 90%;
            border-radius: 2px;
            filter: sepia(20%) brightness(0.8) contrast(110%);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hero-image::after {
            content: "HELLO, YOU.";
            position: absolute;
            bottom: -20px;
            right: -20px;
            font-size: 4rem;
            font-weight: 900;
            color: rgba(229, 9, 20, 0.1);
            z-index: -1;
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                height: auto;
                padding: 120px 5% 50px;
            }
            .hero-content h1 { font-size: 3.5rem; }
            .hero-content p { margin: 0 auto 30px; }
            .hero-image img { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">YOU.</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <span class="sub-title">Psychological Thriller / Crime / Drama</span>
            <h1>JOE <br> <span class="highlight">GOLDBERG</span></h1>
            <p>"I’ve realized the only way to be happy is to be with you. To protect you. To love you. No matter the cost."</p>
            <a href="https://www.imdb.com/title/tt6364624/" target="_blank" class="btn-main">WATCH  more</a>
        </div>
        <div class="hero-image">
            <img loading="lazy" src="https://i.pinimg.com/736x/7b/47/a5/7b47a52d394ed32c84575bf4cde35e86.jpg" alt="Joe Goldberg, YOU">
        </div>
    </section>

</body>
</html>
