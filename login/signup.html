<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/all.min.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Sign Up - Movie Streaming</title>
</head>
<body>
    <button class="btn home"> <a href="../index.html"><i><i class="fa-regular fa-house"></i></i></a></button>
    <div class="login-card">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Email or mobile number" required>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Sign Up</button>
        </form>
        
        <div class="signup-text">
            Already have an account? <a href="login.html"><b>Sign in now.</b></a>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
