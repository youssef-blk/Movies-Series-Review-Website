<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
 
    <link rel="stylesheet" href="../css/all.min.css" />
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login - Movie Streaming</title>
</head>
<body>
  <button class="btn home"> <a href="../index.html"><i><i class="fa-regular fa-house"></i></i></a></button>
    <div class="login-card">
        <h2>Sign In</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Email or mobile number" required>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            
            <div class="extra-links">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Need help?</a>
            </div>
        </form>
        
        <div class="signup-text">
            New to our site? <a href="signup.html"><b>Sign up now.</b></a>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
