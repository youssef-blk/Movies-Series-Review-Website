<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- Fichier CSS -->
    <link rel="stylesheet" href="css/show.css" />
    <!-- Icons -->
    <link rel="stylesheet" href="css/all.min.css" />
    <title>ShowTime</title>
  </head>
  <body>


    <div class="container-fluid">
      <nav>
        <button><a href="#"><i class="fa-solid fa-arrow-left"></i>Go Back</a></button>
      </nav>

      <div class="row mx-5 px-5 align-items-center">
        <div class="poster col-3 p-4 pe-5">
          <img loading="lazy" src="" alt="">
        </div>
        <div class="info col-9">
          <div class="adult-div d-flex align-items-center gap-3">
            <span>+18</span>
            <p class="m-0">Adult Content</p>
          </div>
          <h1 class="title"></h1>
          <h3 class="original_title">Original Title : <span class="name"></span> <span class="thePoint">.</span> <span class="year"></span></h3>
          <div class="sub_info d-flex gap-5 text-uppercase py-3">
            <div class="rating">
              <h3>Rating</h3>
              <span class="fw-bold"><span class="fs-1"></span><span class="fs-3">/10</span></span>
            </div>
            <div class="votes">
              <h3>Votes</h3>
              <span class="fs-1 fw-bold"></span>
            </div>
            <div class="language">
              <h3>language</h3>
              <span class="fs-1 fw-bold"></span>
            </div>
            <div class="origin">
              <h3>origin</h3>
              <span class="fs-1 fw-bold"></span>
            </div>
          </div>
          <p class="story m-0"></p>
          <div class="categories d-flex gap-3 my-4"></div>
          <div class="btns d-flex gap-4">
            <button class="primary-btn"><i class="fa-regular fa-bookmark"></i> Add to My PlayList</button>
            <button class="icon-btn"><i class="fa-solid fa-share-nodes"></i></button>
          </div>
        </div>
      </div>
    </div>




<div id="toastPopup" style="display:none; position:fixed; top:20px; right:20px; background:#e63946; color:white; padding:15px 25px; border-radius:8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index:10000; align-items:center; gap:12px; font-family: sans-serif; border-left: 5px solid #b91c1c; animation: slideIn 0.5s ease-out;">
  <i class="fas fa-exclamation-circle" style="font-size:20px;"></i>
  <div>
    <strong style="display:block; font-size:14px;">Attention!</strong>
    <span id="toastMessage" style="font-size:13px;">Please log in first.</span>
  </div>
</div>

<style>
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
</style>
    <!-- Fichier JS -->
    <script src="js/show.js"></script>
    <!-- Bootsrap -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
